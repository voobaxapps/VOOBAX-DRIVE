name: Build VOOBAX Drive APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Extract VOOBAX handoff
        run: |
          test -s VOOBAX-Drive-reviewed-handoff.zip
          unzip -o VOOBAX-Drive-reviewed-handoff.zip

      - name: Verify patch regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Checkout pinned Open Headunit v.3.5.0
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/andreknieriem/open-headunit.git
          git -C upstream fetch --depth 1 origin 1c1b5b7261ebebde8000778ff2c06e3af3e3a326
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = 1c1b5b7261ebebde8000778ff2c06e3af3e3a326

      - name: Apply branding and localization
        run: |
          python3 apply_voobax.py upstream
          test -s upstream/app/src/main/res/values-az/strings.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install upstream Android toolchain
        shell: bash
        run: |
          NDK_VERSION=$(sed -n 's/.*ndkVersion = "\([^"]*\)".*/\1/p' upstream/app/build.gradle.kts | head -1)
          test -n "$NDK_VERSION"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION" 'cmake;3.22.1'

      - name: Build debug-signed APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Verify APK identity, signature, size and checksum
        shell: bash
        run: |
          mkdir -p dist
          mapfile -t APKS < <(find upstream/app/build/outputs/apk/github/debug -name '*.apk' -type f)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > dist/apk-badging.txt
          grep -q "package: name='com.voobax.drive'" dist/apk-badging.txt
          cp "$APK" dist/VOOBAX-Drive-debug.apk
          cd dist
          stat --printf='%n %s bytes\n' VOOBAX-Drive-debug.apk | tee APK-SIZE.txt
          sha256sum VOOBAX-Drive-debug.apk | tee SHA256SUMS
          cat APK-SIZE.txt SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOOBAX-Drive-debug-APK
          path: dist/
          if-no-files-found: error

      - name: Package corresponding patched source
        run: |
          tar --exclude=.git --exclude=.gradle --exclude=build --exclude=.cxx -czf VOOBAX-Drive-source.tar.gz upstream apply_voobax.py translations_az.json overlay

      - name: Upload corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: VOOBAX-Drive-corresponding-source
          path: VOOBAX-Drive-source.tar.gz
          if-no-files-found: error
